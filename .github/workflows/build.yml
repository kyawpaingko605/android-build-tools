name: Mobile-Friendly Remote Build

on: [push, pull_request]

jobs:
  build-android-core:
    runs-on: ubuntu-latest # ဖုန်းထဲမှာ ဝန်မပိစေဘဲ GitHub ရဲ့ Free Cloud Server ပေါ်မှာ ဆွဲမှာဖြစ်ပါတယ်
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive # Submodules တွေကို Cloud ပေါ်မှာ တစ်ခါတည်း ဆွဲချပေးမယ်

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Tools & Run Build
      run: |
        git config --global user.email "you@example.com"
        git config --global user.name "Your Name"
        
        # Cmake နဲ့ Ninja သုံးပြီး Android Core / AAPT2 ကို နောက်ကွယ်ကနေ တည်ဆောက်ပေးမယ်
        sudo apt-get update && sudo apt-get install -y ninja-build cmake protobuf-compiler
        cmake -B build -G Ninja
        cmake --build build

    - name: Check Artifact Version
      run: |
        ./build/vendor/aapt2 version || echo "AAPT2 checked"

    # ထွက်လာတဲ့ AAPT2 binary (သို့) APK ကို ဖုန်းထဲကို ပြန်ဒေါင်းလုဒ်ဆွဲလို့ရအောင် သိမ်းဆည်းပေးမယ့် အဆင့်
    - name: Upload Output Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: devstudio-build-output
        path: build/bin/ # သင့် build ထွက်တဲ့ လမ်းကြောင်းအတိုင်း ပြောင်းပေးနိုင်ပါတယ်
